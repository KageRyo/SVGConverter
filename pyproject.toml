[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "svgconverter"
version = "1.3.0"
description = "Embed or vectorize PNG and JPEG images as SVG."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chien-Hsun Chang" }]
keywords = ["image", "svg", "converter", "raster", "embed", "vectorize"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.8", "twine>=6.0"]
vectorize = ["vtracer>=0.6.15,<1.0"]

[project.urls]
Homepage = "https://github.com/KageRyo/SVGConverter"
Documentation = "https://github.com/KageRyo/SVGConverter#readme"
Issues = "https://github.com/KageRyo/SVGConverter/issues"
Changelog = "https://github.com/KageRyo/SVGConverter/blob/main/CHANGELOG.md"

[project.scripts]
svgconverter = "svgconverter.cli:main"
svgconverter-gui = "svgconverter.gui:run_gui"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"svgconverter.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
