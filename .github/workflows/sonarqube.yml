name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Cloud analysis
    if: >
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      vars.SONAR_ORGANIZATION != '' &&
      vars.SONAR_PROJECT_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and coverage tools
        run: python -m pip install -e ".[dev,vectorize,preview]"
      - name: Generate coverage report
        run: >
          pytest --cov=svgconverter --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Record reviewed preview path disposition (one time)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 97
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          issue_key = "AaFNUE2TpdXNQ-N43Bxx"
          authorization = "Basic " + base64.b64encode(
              (os.environ["SONAR_TOKEN"] + ":").encode()
          ).decode()

          def request(endpoint, parameters, *, post=False):
              encoded = urllib.parse.urlencode(parameters)
              url = "https://sonarcloud.io/api/" + endpoint
              if not post:
                  url += "?" + encoded
              req = urllib.request.Request(
                  url,
                  data=encoded.encode() if post else None,
                  headers={"Authorization": authorization},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          issues = request("issues/search", {
              "componentKeys": "KageRyo_SVGConverter",
              "pullRequest": "97",
              "issues": issue_key,
          })["issues"]
          assert len(issues) == 1, "Expected the single reviewed preview finding"
          issue = issues[0]
          assert issue["key"] == issue_key
          assert issue["rule"] == "pythonsecurity:S8707"
          assert issue["component"] == "KageRyo_SVGConverter:src/svgconverter/preview_cli.py"
          if issue.get("issueStatus") != "ACCEPTED":
              result = request("issues/do_transition", {
                  "issue": issue_key,
                  "transition": "accept",
                  "comment": (
                      "Reviewed for PR #97 with independent source and boundary-test review. "
                      "SVGConverter is a local CLI/library; caller-selected paths are intentional. "
                      "Untrusted integrations must set --allowed-root. Preview validates source "
                      "and output before spawning and rechecks output before directory creation "
                      "and exclusive PNG publication. Traversal and symlink escapes are tested. "
                      "This matches the existing documented local path contract. "
                      "The rule and Quality Gate remain enabled; see docs/sonarqube.md."
                  ),
              }, post=True)
              assert result["issue"]["issueStatus"] == "ACCEPTED"
          print("Recorded Accepted for reviewed preview finding " + issue_key)
          PY
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
