name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import svgconverter; print(svgconverter.__version__)"

  windows-executable:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build standalone GUI executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SVGConverter --paths src
          --collect-data "svgconverter.resources" main.py
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $executable = (Resolve-Path "dist/SVGConverter.exe").Path
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
            throw "SVGConverter.exe exited during startup."
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: dist/SVGConverter.exe
          if-no-files-found: error

  vectorize:
    name: Vectorize integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install vectorize extra and test tools
        run: python -m pip install -e ".[dev,vectorize]"
      - name: Test vectorize mode
        run: pytest -q tests/test_vectorize.py
