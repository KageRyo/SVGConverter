name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import svgconverter; print(svgconverter.__version__)"

  windows-executable:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Smoke test installed CLI conversion
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP "svgconverter-input.png"
          $outputPath = Join-Path $env:RUNNER_TEMP "svgconverter-output.svg"
          $env:SVGCONVERTER_INPUT = $inputPath
          python -c "import os; from PIL import Image; Image.new('RGB', (2, 2), (25, 50, 75)).save(os.environ['SVGCONVERTER_INPUT'])"
          svgconverter $inputPath --output $outputPath
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw "SVGConverter did not create the expected output file."
          }
          [xml]$document = Get-Content -Raw -LiteralPath $outputPath
          if ($document.DocumentElement.LocalName -ne "svg") {
            throw "The conversion output root element is not SVG."
          }
          if ($document.DocumentElement.NamespaceURI -ne "http://www.w3.org/2000/svg") {
            throw "The conversion output is missing the SVG namespace."
          }
      - name: Build standalone GUI executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SVGConverter --paths src
          --collect-data "svgconverter.resources" main.py
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $executable = (Resolve-Path "dist/SVGConverter.exe").Path
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
            throw "SVGConverter.exe exited during startup."
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: dist/SVGConverter.exe
          if-no-files-found: error

  vectorize:
    name: Vectorize integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install vectorize extra and test tools
        run: python -m pip install -e ".[dev,vectorize]"
      - name: Test vectorize mode
        run: pytest -q tests/test_vectorize.py
